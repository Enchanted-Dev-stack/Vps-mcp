services:
  postgres:
    image: postgres:17-alpine
    container_name: vps-mcp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpsmcp
      POSTGRES_PASSWORD: ${VPS_MCP_DB_PASSWORD:-vpsmcp_dev}
      POSTGRES_DB: vpsmcp
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vps_mcp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpsmcp -d vpsmcp"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  vps_mcp_postgres:
